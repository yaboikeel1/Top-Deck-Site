<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Deck Admin V5</title>
<style>
:root{--bg:#080808;--panel:#141414;--line:#303030;--gold:#f1c84c;--text:#fff;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2b2108,#080808 35%);color:var(--text);font-family:Arial,sans-serif}
.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}
h1,h2,h3{margin-top:0}.brand{color:var(--gold)}a{color:var(--gold);text-decoration:none}.nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero{padding:34px 0}.hero h2{font-size:clamp(2rem,5vw,4.5rem);line-height:1;margin:8px 0}.badge{display:inline-block;padding:7px 11px;border-radius:999px;border:1px solid #765f22;color:var(--gold);font-weight:800}
.card{background:linear-gradient(#191919,#101010);border:1px solid var(--line);border-radius:18px;padding:20px}.hidden{display:none!important}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#090909;color:#fff;border:1px solid #3b3b3b;border-radius:10px;padding:11px}
textarea{min-height:80px;resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,#d8a92e,#f4d56f);color:#111}.secondary{background:#272727;color:#fff;border:1px solid #444}
.notice{margin-top:14px;padding:12px;border-radius:10px;background:#202020;border:1px solid #333}.success{border-color:#2f7443}.error{border-color:#7b3636}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(6,minmax(130px,1fr));margin-bottom:18px}.stat{background:#121212;border:1px solid var(--line);border-radius:14px;padding:16px}
.stat strong{display:block;color:var(--gold);font-size:2rem}.toolbar{grid-template-columns:2fr 1fr auto;margin-bottom:16px}
.release{display:grid;grid-template-columns:90px minmax(190px,1fr) minmax(230px,1fr) minmax(240px,1fr);gap:15px;padding:15px;background:#0c0c0c;border:1px solid var(--line);border-radius:14px}
.cover{width:90px;height:90px;object-fit:cover;border-radius:11px;border:1px solid #3b3b3b;background:#1c1c1c}.placeholder{display:flex;align-items:center;justify-content:center;color:#777;font-size:.8rem;text-align:center}
.artist{color:var(--gold);font-weight:800}.small{font-size:.9rem;color:var(--muted);line-height:1.45}audio{width:100%;margin-top:10px}.actions{display:grid;gap:9px}
.login{max-width:650px}.pw{position:relative}.pw input{padding-right:128px}.pw button{position:absolute;right:6px;top:6px;padding:7px 10px;background:#2b2b2b;color:white;border:1px solid #555}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.release{grid-template-columns:80px 1fr 1fr}.actions{grid-column:2/4}}
@media(max-width:700px){.wrap{padding:14px}.top{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.release{grid-template-columns:70px 1fr}.review,.actions{grid-column:1/3}.cover{width:70px;height:70px}}
</style></head><body><div class="wrap">
<header class="top"><div><h1 class="brand">Top Deck Music Group</h1><div class="small">V5 Label Control Center</div></div><nav class="nav"><a href="../index.html">Main Site</a><a href="../artist-portal/">Artist Portal</a><button id="signOutBtn" class="secondary hidden">Sign Out</button></nav></header>
<section class="hero"><span class="badge">ADMIN V5</span><h2>Control the label. Review releases. Move with purpose.</h2></section>
<section id="loginCard" class="card login"><h2>Admin Login</h2><label>Email</label><input id="email" type="email"><label>Password</label><div class="pw"><input id="password" type="password"><button id="togglePassword" type="button">Show password</button></div><button id="loginBtn" class="primary" style="margin-top:15px">Sign In</button><div id="loginStatus" class="notice">Admin access is required.</div></section>
<main id="dashboard" class="hidden">
<section class="grid stats"><div class="stat"><span>Artists</span><strong id="artistCount">0</strong></div><div class="stat"><span>Pending</span><strong id="pendingCount">0</strong></div><div class="stat"><span>Approved</span><strong id="approvedCount">0</strong></div><div class="stat"><span>Needs Changes</span><strong id="changesCount">0</strong></div><div class="stat"><span>Rejected</span><strong id="rejectedCount">0</strong></div><div class="stat"><span>Total Releases</span><strong id="releaseCount">0</strong></div></section>
<section class="card"><div class="grid toolbar"><input id="searchInput" placeholder="Search artist or release..."><select id="statusFilter"><option value="All">All statuses</option><option>Pending</option><option>Approved</option><option>Needs Changes</option><option>Rejected</option></select><button id="refreshBtn" class="secondary">Refresh</button></div><div id="releaseList" class="grid"></div><div id="adminStatus" class="notice">Loading dashboard...</div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="admin-v5.js"></script></body></html>
